<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hlasovací Aplikace</title>
  <!-- React a ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel pro JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS pro stylování -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js pro generování QR kódů -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Cílové adresy
    const DISPLAY_URL = "1url.cz/@hlasujeme";
    const DIRECT_JOIN_URL = "https://mivalent.github.io/hlas/#/ucastnici";

    // Komponenta pro vygenerování QR kódu
    const QRCodeComponent = ({ value, size = 180 }) => {
      const qrRef = useRef(null);

      useEffect(() => {
        if (qrRef.current) {
          qrRef.current.innerHTML = "";
          new window.QRCode(qrRef.current, {
            text: value,
            width: size,
            height: size,
            colorDark: "#1e293b",
            colorLight: "#ffffff",
            correctLevel: window.QRCode.CorrectLevel.H
          });
        }
      }, [value, size]);

      return <div ref={qrRef} className="p-2 bg-white rounded-lg shadow-md inline-block"></div>;
    };

    // Hlavní Komponenta Aplikace
    const App = () => {
      const [route, setRoute] = useState(window.location.hash || '#/prezentace');
      const [pin, setPin] = useState('8421');

      useEffect(() => {
        const handleHashChange = () => {
          setRoute(window.location.hash || '#/prezentace');
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const isTeacher = route.startsWith('#/prezentace');

      return (
        <div className="flex flex-col min-h-screen">
          {/* Horní navigace */}
          <header className="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center">
            <div className="flex items-center space-x-2">
              <span className="font-bold text-xl tracking-wide text-indigo-400">Hlasování</span>
            </div>
            
            {/* Pokyny k přihlášení na liště učitele */}
            {isTeacher && (
              <div className="flex items-center bg-slate-700 px-4 py-1.5 rounded-full text-sm space-x-4 border border-slate-600">
                <span>Adresa: <strong className="text-amber-300 font-mono text-base">{DISPLAY_URL}</strong></span>
                <span className="text-slate-400">|</span>
                <span>PIN: <strong className="text-amber-300 font-mono text-base">{pin}</strong></span>
              </div>
            )}

            <div className="text-xs text-slate-400">
              {isTeacher ? (
                <a href="#/ucastnici" className="hover:underline text-indigo-300">Přejít do pohledu žáka</a>
              ) : (
                <a href="#/prezentace" className="hover:underline text-indigo-300">Přejít do prezentace</a>
              )}
            </div>
          </header>

          {/* Obsahové rozhraní */}
          <main className="flex-1 flex flex-col justify-center items-center p-6">
            {isTeacher ? (
              <PresentationView pin={pin} />
            ) : (
              <StudentView />
            )}
          </main>
        </div>
      );
    };

    // Učitelský / Prezentační pohled
    const PresentationView = ({ pin }) => {
      const fullDirectUrl = `${DIRECT_JOIN_URL}?pin=${pin}`;

      return (
        <div className="max-w-3xl w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-200">
          <h1 className="text-3xl font-extrabold text-slate-800 mb-2">Připojte se k hlasování</h1>
          <p className="text-slate-600 mb-8">Namiřte fotoaparát na QR kód nebo zadejte adresu do prohlížeče</p>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center bg-slate-50 p-6 rounded-xl border border-slate-200">
            {/* QR Kód směřující přímo na účastnickou URL */}
            <div className="flex flex-col items-center">
              <QRCodeComponent value={fullDirectUrl} size={190} />
              <span className="text-xs text-slate-500 mt-2">Naskenujte pro přímé připojení</span>
            </div>

            {/* Slovní pokyny s krátkou adresou 1url.cz */}
            <div className="flex flex-col justify-center text-left space-y-4">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-slate-400">1. Otevřete v mobilu</span>
                <div className="text-2xl font-bold text-indigo-600 font-mono mt-1 bg-indigo-50 p-2 rounded-lg border border-indigo-100 text-center md:text-left">
                  {DISPLAY_URL}
                </div>
              </div>

              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-slate-400">2. Zadejte Kód místnosti</span>
                <div className="text-3xl font-extrabold text-amber-600 font-mono tracking-widest mt-1 bg-amber-50 p-2 rounded-lg border border-amber-100 text-center md:text-left">
                  {pin}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Účastnický / Žákovský pohled
    const StudentView = () => {
      const [inputPin, setInputPin] = useState('');
      const [joined, setJoined] = useState(false);

      // Načtení PINu z URL parametrů, pokud přišel přes QR kód
      useEffect(() => {
        const params = new URLSearchParams(window.location.hash.split('?')[1]);
        const pinFromUrl = params.get('pin');
        if (pinFromUrl) {
          setInputPin(pinFromUrl);
          setJoined(true);
        }
      }, []);

      const handleJoin = (e) => {
        e.preventDefault();
        if (inputPin.trim()) {
          setJoined(true);
        }
      };

      if (!joined) {
        return (
          <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-200 text-center">
            <h2 className="text-2xl font-bold text-slate-800 mb-4">Připojení k prezentaci</h2>
            <form onSubmit={handleJoin} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-600 mb-1 text-left">
                  PIN místnosti
                </label>
                <input
                  type="text"
                  value={inputPin}
                  onChange={(e) => setInputPin(e.target.value)}
                  placeholder="Vložte PIN"
                  className="w-full text-center text-2xl font-mono tracking-widest p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  maxLength={6}
                  required
                />
              </div>
              <button
                type="submit"
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition"
              >
                Vstoupit
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-200 text-center">
          <div className="inline-flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full mb-3">
            ✓
          </div>
          <h2 className="text-2xl font-bold text-slate-800 mb-2">Jste připojeni!</h2>
          <p className="text-slate-500 text-sm">Sledujte obrazovku učitele. Jakmile spustí otázku, objeví se vám zde moźnosti.</p>
        </div>
      );
    };

    // Renderování aplikace
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

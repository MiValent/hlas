<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export do CSV a PDF</title>
  
  <!-- Knihovna html2pdf.js pro generování PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f4f4f9;
    }

    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      max-width: 700px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-csv {
      background-color: #217346;
      color: white;
    }

    .btn-pdf {
      background-color: #d9381e;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Oblast, která se bude exportovat do PDF -->
    <div id="export-area">
      <h2>Výsledky měření</h2>
      <p><strong>Uživatel:</strong> Jan Novák</p>
      <p><strong>Datum:</strong> 28. 09. 2026</p>

      <table id="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Metrika</th>
            <th>Hodnota</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Rychlost odezvy</td>
            <td>45 ms</td>
          </tr>
          <tr>
            <td>2</td>
            <td>Úspěšnost</td>
            <td>98 %</td>
          </tr>
          <tr>
            <td>3</td>
            <td>Celkové skóre</td>
            <td>95/100</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Tlačítka pro akce -->
    <div class="actions">
      <button class="btn-csv" onclick="downloadCSV()">Exportovat do CSV</button>
      <button class="btn-pdf" onclick="downloadPDF()">Exportovat do PDF</button>
    </div>
  </div>

  <script>
    // Funkce pro stažení PDF
    function downloadPDF() {
      const element = document.getElementById("export-area");
      
      const opt = {
        margin:       10,
        filename:     'vysledky.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Funkce pro stažení CSV
    function downloadCSV() {
      const table = document.getElementById("data-table");
      let csv = [];
      
      for (let row of table.rows) {
        let cols = Array.from(row.cells).map(cell => `"${cell.innerText}"`);
        csv.push(cols.join(";")); // Použijeme středník pro správné otevření v českém Excelu
      }

      const csvContent = "\uFEFF" + csv.join("\n"); // \uFEFF přidá UTF-8 BOM pro správnou češtinu
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "vysledky.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="cs" class="h-full font-sans antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hlasovací systém</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col justify-between p-4 sm:p-6">

    <!-- HEADER / HORNI LISTA -->
    <header class="max-w-4xl w-full mx-auto flex items-center justify-between py-4 border-b border-slate-200 dark:border-slate-800 mb-8">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="vote" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">hlas</h1>
        </div>

        <button id="btn-open-profile" class="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 font-semibold text-sm px-4 py-2 rounded-xl shadow-sm transition-all">
            <i data-lucide="user" class="w-4 h-4 text-indigo-500"></i>
            <span id="header-user-status">Profil / Přihlášení</span>
        </button>
    </header>

    <!-- HLAVNI OBSAH -->
    <main class="max-w-4xl w-full mx-auto flex-grow flex flex-col justify-center items-center text-center py-10">
        <div id="app-main-content" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-xl max-w-lg w-full">
            <h2 class="text-xl font-bold mb-2">Vítejte v hlasovací aplikaci</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Pro zobrazení rozhraní a správu se prosím přihlaste v horní liště.</p>
            
            <button onclick="document.getElementById('profile-modal').classList.remove('hidden')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-2xl shadow-lg shadow-indigo-500/20 transition-all">
                Otevřít přihlášení
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="max-w-4xl w-full mx-auto text-center py-4 text-xs text-slate-400">
        &copy; Hlasovací systém | Hosted on GitHub Pages
    </footer>

    <!-- MODALNÍ OKNO PRO PŘIHLÁŠENÍ A PROFIL -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-md w-full shadow-2xl relative">
            <!-- Zavírací tlačítko -->
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mb-4">Účet a Přihlášení</h3>

            <!-- 1. POHLED PRO NEPŘIHLÁŠENÉHO UŽIVATELE -->
            <div id="auth-logged-out-view" class="space-y-4">
                <p class="text-xs text-slate-500 dark:text-slate-400">Přihlaste se pro vytváření hlasování a správu v cloudu.</p>
                
                <!-- Google Tlačítko -->
                <button id="btn-google-login" type="button" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-750 transition-all shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Přihlásit přes Google
                </button>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                    <span class="flex-shrink mx-3 text-xs text-slate-400">nebo e-mailem</span>
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                </div>

                <!-- Formulář pro E-mail a Heslo -->
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">E-mail</label>
                        <input type="email" id="auth-email" placeholder="ucitel@skola.cz" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Heslo</label>
                        <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button id="btn-email-login" type="button" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-3 rounded-xl text-xs transition-colors">
                        Přihlásit se
                    </button>
                    <button id="btn-email-register" type="button" class="flex-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-700 dark:text-slate-300 font-semibold py-2.5 px-3 rounded-xl text-xs transition-colors">
                        Registrovat
                    </button>
                </div>
            </div>

            <!-- 2. POHLED PRO PŘIHLÁŠENÉHO UŽIVATELE -->
            <div id="auth-logged-in-view" class="hidden space-y-4">
                <div class="p-4 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-2xl flex items-center justify-between">
                    <div>
                        <span class="block text-[10px] uppercase tracking-wider font-bold text-emerald-600 dark:text-emerald-400">Přihlášen jako</span>
                        <span id="user-email-display" class="text-sm font-semibold text-slate-900 dark:text-white truncate block max-w-[180px]"></span>
                    </div>
                    <button id="btn-logout" class="text-xs bg-white dark:bg-slate-800 hover:bg-red-50 hover:text-red-600 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl font-medium transition-colors">
                        Odhlásit se
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE FIREBASE MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Konfigurace vašeho Firebase projektu
        const firebaseConfig = {
            apiKey: "AIzaSyA5wm0BqfTdlxsQ3zQ-i_tpua2R01NQ4Oc",
            authDomain: "hlasovani-6d722.firebaseapp.com",
            projectId: "hlasovani-6d722",
            storageBucket: "hlasovani-6d722.firebasestorage.app",
            messagingSenderId: "520308415470",
            appId: "1:520308415470:web:ef73f0abf6068953314cff"
        };

        // Inicializace Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Inicializace ikon Lucide
        lucide.createIcons();

        // Ovládání Modalu
        const modal = document.getElementById('profile-modal');
        document.getElementById('btn-open-profile').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.add('hidden'));

        // 1. Google Přihlášení
        document.getElementById('btn-google-login').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                alert("Chyba při přihlášení přes Google: " + error.message);
            }
        });

        // 2. Přihlášení E-mailem a Heslem
        document.getElementById('btn-email-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                alert("Vyplňte prosím e-mail i heslo.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Chyba přihlášení: " + error.message);
            }
        });

        // 3. Registrace nového e-mailu
        document.getElementById('btn-email-register').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                alert("Vyplňte e-mail i heslo pro registrace.");
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Účet úspěšně vytvořen a jste přihlášeni.");
            } catch (error) {
                alert("Chyba registrace: " + error.message);
            }
        });

        // 4. Odhlášení
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
        });

        // Sledování stavu přihlášení uživatele
        onAuthStateChanged(auth, (user) => {
            const loggedOutView = document.getElementById('auth-logged-out-view');
            const loggedInView = document.getElementById('auth-logged-in-view');
            const userEmailDisplay = document.getElementById('user-email-display');
            const headerStatus = document.getElementById('header-user-status');

            if (user) {
                // Přihlášen
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                userEmailDisplay.textContent = user.email || 'Google Uživatel';
                headerStatus.textContent = user.email ? user.email.split('@')[0] : 'Uživatel';
            } else {
                // Odhlášen
                loggedOutView.classList.remove('hidden');
                loggedInView.classList.add('hidden');
                headerStatus.textContent = 'Profil / Přihlášení';
            }
        });
    </script>
</body>
</html>
